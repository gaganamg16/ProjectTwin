<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ProjectTwin | Add Project</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        .header {
            background: #172554;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            color: #172554;
            margin-bottom: 10px;
        }

        .card p {
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 15px 0 7px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>ProjectTwin</h1>
        <p>Project Database Management</p>
    </div>

    <div class="container">

        <div class="card">

            <h2>Add Existing Project</h2>

            <p>
                Add a previously submitted college project to the
                ProjectTwin comparison database.
            </p>

            <form method="POST">

                <label for="title">Project Title</label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Enter project title"
                    required
                >

                <label for="description">Project Description</label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Enter project description"
                    required
                ></textarea>
                <label for="department">Department</label>

<select name="department" id="department" required>
    <option value="">Select Department</option>
    <option value="CSE">CSE</option>
    <option value="ISE">ISE</option>
    <option value="ECE">ECE</option>
    <option value="EEE">EEE</option>
    <option value="ME">ME</option>
</select>

                <button type="submit">
                    Add Project
                </button>

            </form>

            <a href="/" class="back">
                ← Back to Project Similarity Checker
            </a>
            <a href="/dashboard">Dashboard</a>

        </div>

    </div>

</body>

</html>
